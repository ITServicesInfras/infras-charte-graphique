<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide GED SMI QSE —  Infrasgroup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root{
  --brand:#8C1D2C;--brand-dk:#6E1421;--brand-tint:#F4E6E8;--brand-tint-bd:#E3C4CA;
  --slate:#5B6472;--blue:#2563EB;--red:#DC2626;--green:#2E8B57;--green-t:#E7F4EA;
  --ink:#22201f;--ink2:#5b5a55;--ink3:#8a8980;
  --line:rgba(40,20,24,.12);
  --rmd:9px;--rlg:16px;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code","Consolas","Courier New",monospace;
  --sh-sm:0 1px 3px rgba(20,8,12,.10);--sh:0 8px 26px rgba(40,8,14,.16);--sh-lg:0 16px 44px rgba(30,6,12,.30);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
  background:linear-gradient(157deg,#8C1D2C 0%,#7a1623 55%,#611019 100%);background-attachment:fixed}
.wrap{max-width:920px;margin:0 auto;padding:30px 22px 70px}
.brandmark{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.12em;color:#fff;opacity:.92;margin-bottom:12px}
.brandmark .dot{width:8px;height:8px;border-radius:50%;background:#fff}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero h1{font-size:26px;font-weight:700;color:#fff;margin:0 0 5px;letter-spacing:-.01em}
.hero p{font-size:13.5px;color:rgba(255,255,255,.85);margin:0;max-width:560px}
.langtog{display:flex;gap:0;background:rgba(255,255,255,.16);border-radius:30px;padding:3px}
.langtog button{border:0;background:transparent;color:rgba(255,255,255,.8);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:30px;cursor:pointer;font-family:inherit}
.langtog button.on{background:#fff;color:var(--brand)}
#nav{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 6px}
.navchip{font-size:11.5px;padding:5px 12px;border-radius:30px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.9);text-decoration:none;cursor:pointer;transition:background .15s}
.navchip:hover{background:rgba(255,255,255,.28)}
.card{background:#fff;border-radius:var(--rlg);box-shadow:var(--sh);padding:20px 22px;margin-top:16px;scroll-margin-top:14px}
.card h2{font-size:17px;font-weight:700;color:var(--brand);margin:0 0 3px;display:flex;align-items:center;gap:9px}
.card h2 .ti{font-size:20px}
.card .knum{font-size:11px;font-weight:700;color:#fff;background:var(--brand);width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.p{font-size:13.5px;color:var(--ink2);margin:10px 0}
.call{display:flex;gap:10px;border-radius:11px;padding:11px 13px;margin:12px 0;font-size:12.5px;line-height:1.55}
.call i{font-size:17px;flex:none;margin-top:1px}
.call.info{background:#EEF1F4;color:#3f4853}.call.info i{color:var(--slate)}
.call.warn{background:var(--brand-tint);color:var(--brand-dk)}.call.warn i{color:var(--brand)}
.call.good{background:var(--green-t);color:#1d6b43}.call.good i{color:var(--green)}
.call.danger{background:#FBE9E9;color:#991B1B}.call.danger i{color:var(--red)}
.steps{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.step{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac,var(--slate));border-radius:11px;box-shadow:var(--sh-sm);padding:10px 13px}
.step.hi{border-left-color:var(--brand);background:var(--brand-tint)}
.step.go{border-left-color:var(--green);background:var(--green-t)}
.snum{flex:none;width:23px;height:23px;border-radius:50%;background:var(--slate);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step.hi .snum{background:var(--brand)}.step.go .snum{background:var(--green)}
.st-t{font-size:13px;font-weight:600;color:var(--ink)}
.st-d{font-size:12px;color:var(--ink2);margin-top:1px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:12px 0}
.fbox{flex:1;min-width:120px;border-radius:10px;padding:9px 11px;font-size:12px;text-align:center;line-height:1.3;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.fbox.hi{background:var(--brand-tint);border-color:var(--brand-tint-bd);color:var(--brand-dk)}
.fbox.go{background:var(--green-t);border-color:#BFE3CB;color:#1d6b43}
.fbox b{display:block;font-size:12px;color:var(--ink)}
.fbox.hi b{color:var(--brand)}.fbox.go b{color:#1d6b43}
.sep{align-self:center;color:var(--ink3);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}
.gcard{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;box-shadow:var(--sh-sm)}
.gcard .gt{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.gcard .gt i{color:var(--brand);font-size:15px}
.gcard .gd{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.chl{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.chl .em{font-size:15px}
.chl .cn{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:560px){.rules{grid-template-columns:1fr}}
.rcol{border-radius:11px;padding:12px 14px}
.rcol.do{background:var(--green-t)}.rcol.dont{background:#FBE9E9}
.rcol h4{margin:0 0 7px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.rcol.do h4{color:#1d6b43}.rcol.dont h4{color:#991B1B}
.rcol ul{margin:0;padding-left:2px;list-style:none}
.rcol li{font-size:12px;color:var(--ink2);padding:3px 0 3px 18px;position:relative;line-height:1.4}
.rcol.do li::before{content:"\2713";position:absolute;left:0;color:var(--green);font-weight:700}
.rcol.dont li::before{content:"\2715";position:absolute;left:0;color:var(--red);font-weight:700}
.perm{margin:12px 0}
.permrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.permrow .pr{font-size:12.5px;font-weight:600;color:var(--ink)}
.permrow .pg{font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
.pill{font-size:11px;padding:2px 9px;border-radius:7px;white-space:nowrap}
.foot{margin-top:26px;text-align:center;color:rgba(255,255,255,.72);font-size:11.5px;line-height:1.7}
.ti{font-style:normal}
</style>
</head>

const SECTIONS=[
 {id:"intro",icon:"ti-compass",nav:{fr:"Présentation",en:"Overview"},

  blocks:[
   {t:"p",fr:"C'est l'espace <b>unique et officiel</b> où sont rangés, validés et suivis tous les documents Qualité, Sécurité et Environnement du groupe. Il vit dans Microsoft Teams (les canaux) et SharePoint. Tout y est centralisé, organisé et largement <b>automatisé</b> : vous déposez vos documents, le système s'occupe du reste.",
        en:"It is the <b>single, official</b> space where all the group's Quality, Safety and Environment documents are stored, approved and tracked. It lives in Microsoft Teams (the channels) and SharePoint. Everything is centralised, organised and largely <b>automated</b>: you add your documents, the system handles the rest."},
   {t:"grid",items:[
     {i:"ti-brand-teams",t:{fr:"Microsoft Teams",en:"Microsoft Teams"},d:{fr:"La porte d'entrée : vous accédez aux documents depuis les canaux.",en:"The entry point: you access documents from the channels."}},
     {i:"ti-folder",t:{fr:"SharePoint",en:"SharePoint"},d:{fr:"Le coffre-fort : stocke les fichiers, l'historique et les droits.",en:"The vault: stores files, history and permissions."}},
     {i:"ti-bolt",t:{fr:"Automatisations",en:"Automations"},d:{fr:"Les robots en coulisse : validation, alertes, création de dossiers.",en:"The behind-the-scenes robots: approval, alerts, folder creation."}}
   ]}
  ]},

 {id:"orga",icon:"ti-folders",nav:{fr:"Organisation",en:"Structure"},
  title:{fr:"Comment c'est organisé",en:"How it is organised"},
  blocks:[
   {t:"p",fr:"La documentation est répartie en <b>9 canaux thématiques</b> dans l'équipe Teams « INF-CSP-SMI-SITE », chacun correspondant à un domaine du SMI (numérotés 0 à 8), plus le canal « _General » pour les annonces. Tous les canaux partagent la <b>même bibliothèque</b> : les recherches et les affichages fonctionnent donc sur l'ensemble.",
        en:"The documentation is split into <b>9 thematic channels</b> in the Teams team \"INF-CSP-SMI-SITE\", each matching an SMI domain (numbered 0 to 8), plus the \"_General\" channel for announcements. All channels share the <b>same library</b>: searches and views therefore work across everything."},
   {t:"channels"},
   {t:"call",tone:"info",fr:{t:"La règle des 3 clics",l:["On ne crée jamais de sous-dossiers à l'infini : 3 niveaux maximum. Au-delà, on utilise les étiquettes (métadonnées) pour classer, pas de nouveaux dossiers."]},
              en:{t:"The 3-click rule",l:["Never create endless sub-folders: 3 levels maximum. Beyond that, use labels (metadata) to organise — not new folders."]}}
  ]},

 {id:"meta",icon:"ti-tags",nav:{fr:"Métadonnées",en:"Metadata"},
  title:{fr:"Les métadonnées (les étiquettes)",en:"Metadata (the labels)"},
  blocks:[
   {t:"p",fr:"Chaque fichier porte des « étiquettes » qui décrivent ce qu'il est (son code, son type, le pays, son statut…). Elles permettent de <b>tout retrouver instantanément</b> sans fouiller dans les dossiers. <b>7 étiquettes sont obligatoires</b> : sans elles, le fichier ne peut pas être enregistré.",
        en:"Each file carries \"labels\" describing what it is (its code, type, country, status…). They let you <b>find anything instantly</b> without digging through folders. <b>7 labels are mandatory</b>: without them, the file cannot be saved."},
   {t:"grid",items:[
     {i:"ti-hash",t:{fr:"Code document",en:"Document code"},d:{fr:"Ex. SMI-PR-03",en:"e.g. SMI-PR-03"}},
     {i:"ti-file",t:{fr:"Type de document",en:"Document type"},d:{fr:"Procédure, Formulaire…",en:"Procedure, Form…"}},
     {i:"ti-flag",t:{fr:"Statut",en:"Status"},d:{fr:"Brouillon, En vigueur…",en:"Draft, In force…"}},
     {i:"ti-sitemap",t:{fr:"Processus",en:"Process"},d:{fr:"Le processus rattaché",en:"The related process"}},
     {i:"ti-world",t:{fr:"Site / Pays",en:"Site / Country"},d:{fr:"La filiale concernée",en:"The relevant entity"}},
     {i:"ti-user",t:{fr:"Propriétaire",en:"Owner"},d:{fr:"Le responsable du doc",en:"The document owner"}},
     {i:"ti-calendar",t:{fr:"Prochaine revue",en:"Next review"},d:{fr:"Date de réexamen",en:"Review date"}}
   ]},
   {t:"call",tone:"warn",fr:{t:"Obligatoire vs recommandé",l:["Les 7 ci-dessus sont obligatoires pour CHAQUE fichier (l'enregistrement est refusé si elles manquent). Les autres étiquettes (référentiel ISO, langue, confidentialité…) sont recommandées mais non bloquantes."]},
              en:{t:"Mandatory vs recommended",l:["The 7 above are mandatory for EVERY file (saving is refused if missing). The other labels (ISO standard, language, confidentiality…) are recommended but not blocking."]}}
  ]},

 {id:"addfile",icon:"ti-file-plus",nav:{fr:"Ajouter un fichier",en:"Add a file"},
  title:{fr:"Ajouter un fichier",en:"Adding a file"},
  blocks:[
   {t:"steps",items:[
     {k:"",t:{fr:"Ouvrir le bon canal",en:"Open the right channel"},d:{fr:"Dans Teams, choisir le canal correspondant au domaine, onglet Fichiers.",en:"In Teams, pick the channel matching the domain, Files tab."}},
     {k:"",t:{fr:"Déposer le fichier",en:"Drop the file"},d:{fr:"Glisser-déposer le document dans le dossier voulu.",en:"Drag and drop the document into the right folder."}},
     {k:"hi",t:{fr:"Remplir les métadonnées",en:"Fill in the metadata"},d:{fr:"Cliquer sur les cases vides dans la grille (ou le volet Détails) et compléter les 7 champs obligatoires.",en:"Click the empty cells in the grid (or the Details pane) and complete the 7 mandatory fields."}},
     {k:"",t:{fr:"Laisser le statut « Brouillon »",en:"Keep status \"Draft\""},d:{fr:"Tant que le document n'est pas finalisé.",en:"Until the document is finalised."}},
     {k:"go",t:{fr:"Passer en « En relecture »",en:"Switch to \"In review\""},d:{fr:"Quand c'est prêt : cela lance automatiquement la validation.",en:"When ready: this automatically launches the approval."}}
   ]},
   {t:"call",tone:"info",fr:{t:"Astuce",l:["Pour remplir plusieurs fichiers d'un coup, utilisez « Modifier en mode grille » : on saisit les informations comme dans un tableur."]},
              en:{t:"Tip",l:["To fill several files at once, use \"Edit in grid view\": you enter the information like in a spreadsheet."]}}
  ]},

 {id:"valid",icon:"ti-circle-check",nav:{fr:"Validation",en:"Approval"},
  title:{fr:"La validation d'un fichier",en:"File approval"},
  blocks:[
   {t:"p",fr:"La validation est <b>automatique</b>. Dès qu'un document passe en « En relecture », l'approbateur reçoit une demande. Personne n'envoie d'e-mail à la main.",
        en:"Approval is <b>automatic</b>. As soon as a document moves to \"In review\", the approver receives a request. Nobody sends e-mails manually."},
   {t:"flow",items:[
     {k:"",b:{fr:"Statut « En relecture »",en:"Status \"In review\""},d:{fr:"",en:""}},
     {k:"",b:{fr:"Demande à l'approbateur",en:"Request to approver"},d:{fr:"e-mail + Teams",en:"e-mail + Teams"}},
     {k:"go",b:{fr:"Approuvé → « En vigueur »",en:"Approved → \"In force\""},d:{fr:"dates auto, rédacteur notifié",en:"auto dates, author notified"}}
   ]},
   {t:"call",tone:"info",fr:{t:"Si rejeté",l:["Le document repasse en « Brouillon » et le rédacteur reçoit le motif pour corriger et resoumettre."]},
              en:{t:"If rejected",l:["The document returns to \"Draft\" and the author receives the reason to correct and resubmit."]}}

 {id:"cycle",icon:"ti-refresh",nav:{fr:"Cycle de vie",en:"Lifecycle"},
  title:{fr:"Cycle de vie & visibilité",en:"Lifecycle & visibility"},
  blocks:[
   {t:"p",fr:"Un document suit des statuts : <b>Brouillon → En relecture → En vigueur → Obsolète / Archivé</b>. Seuls les documents « En vigueur » apparaissent dans l'affichage officiel « Documents En vigueur ». L'historique des versions est conservé automatiquement : <b>inutile de créer des copies « V2 », « V2 final »…</b>",
        en:"A document follows statuses: <b>Draft → In review → In force → Obsolete / Archived</b>. Only \"In force\" documents appear in the official \"In force documents\" view. Version history is kept automatically: <b>no need to create \"V2\", \"V2 final\" copies…</b>"},
   {t:"call",tone:"good",fr:{t:"Une seule version officielle",l:["À tout moment, une seule version fait foi : celle qui est « En vigueur ». C'est l'affichage que tout le monde consulte au quotidien."]},
              en:{t:"One official version",l:["At any time, only one version is authoritative: the one \"In force\". That is the view everyone consults daily."]}}
  ]},

 {id:"registre",icon:"ti-clipboard-list",nav:{fr:"Registre des dossiers",en:"Folder register"},
  title:{fr:"Créer un dossier : le Registre",en:"Creating a folder: the Register"},
  blocks:[
   {t:"p",fr:"Les <b>dossiers ne se créent pas à la main</b>. On les déclare dans la liste « <b>Référentiel Structuration SMI — SMI Structure Register</b> » (onglet du canal _General). Dès qu'on ajoute une ligne, un automatisme crée le dossier dans le bon canal et envoie une notification. Cette liste est la <b>source de vérité</b> : le registre officiel, auditable.",
        en:"<b>Folders are not created by hand</b>. They are declared in the \"<b>Référentiel Structuration SMI — SMI Structure Register</b>\" list (a tab in the _General channel). As soon as a row is added, an automation creates the folder in the right channel and sends a notification. This list is the <b>source of truth</b>: the official, auditable register."},
   {t:"steps",items:[
     {k:"",t:{fr:"Ouvrir le Registre",en:"Open the Register"},d:{fr:"Onglet « Registre SMI » dans le canal _General.",en:"\"SMI Register\" tab in the _General channel."}},
     {k:"",t:{fr:"Ajouter un élément",en:"Add an item"},d:{fr:"Renseigner le nom du dossier, le canal et le dossier parent.",en:"Enter the folder name, the channel and the parent folder."}},
     {k:"go",t:{fr:"Enregistrer",en:"Save"},d:{fr:"Le dossier est créé automatiquement dans Teams + notification.",en:"The folder is automatically created in Teams + notification."}}
   ]}
  ]},

 {id:"gardien",icon:"ti-shield-check",nav:{fr:"Le Gardien",en:"The Guardian"},
  title:{fr:"Le Gardien des dossiers",en:"The Folder Guardian"},
  blocks:[
   {t:"p",fr:"Si quelqu'un crée un dossier <b>directement dans Teams</b> (sans passer par le Registre), un automatisme « gardien » réagit pour garder l'arborescence propre et maîtrisée :",
        en:"If someone creates a folder <b>directly in Teams</b> (without using the Register), a \"guardian\" automation reacts to keep the structure clean and controlled:"},
   {t:"grid",items:[
     {i:"ti-circle-check",t:{fr:"Déjà dans le Registre",en:"Already in the Register"},d:{fr:"Rien ne se passe — le dossier est légitime.",en:"Nothing happens — the folder is legitimate."}},
     {i:"ti-bell",t:{fr:"Créé par une personne autorisée",en:"Created by an authorised person"},d:{fr:"Rappel amical pour penser à le référencer. Le dossier est conservé.",en:"Friendly reminder to register it. The folder is kept."}},
     {i:"ti-trash",t:{fr:"Créé hors règles",en:"Created against the rules"},d:{fr:"Alerte + le dossier est supprimé automatiquement (corbeille 93 jours).",en:"Alert + the folder is automatically deleted (recycle bin, 93 days)."}}
   ]},
   {t:"call",tone:"warn",fr:{t:"Pourquoi cette règle",l:["Elle garantit que l'arborescence reste cohérente, traçable et conforme à l'audit. Tous les dossiers passent par le Registre — rien n'est créé « sauvagement »."]},
              en:{t:"Why this rule",l:["It guarantees the structure stays consistent, traceable and audit-compliant. All folders go through the Register — nothing is created \"wildly\"."]}}
  ]},

 {id:"acces",icon:"ti-lock",nav:{fr:"Accès & sécurité",en:"Access & security"},
  title:{fr:"Accès & sécurité",en:"Access & security"},
  blocks:[
   {t:"p",fr:"Les accès sont gérés par <b>4 groupes</b>. On n'attribue jamais d'accès individuel : on ajoute la personne au bon groupe. Les invités externes (auditeurs, consultants) passent eux aussi par un groupe.",
        en:"Access is managed through <b>4 groups</b>. Individual access is never granted: you add the person to the right group. External guests (auditors, consultants) also go through a group."},
   {t:"perm"},
   {t:"call",tone:"danger",fr:{t:"Dossier 6.4 — Médecine du travail",l:["Accès restreint : seuls les Administrateurs et le Responsable QSE peuvent l'ouvrir. Les autres ne le voient pas."]},
              en:{t:"Folder 6.4 — Occupational health",l:["Restricted access: only Administrators and the QSE Manager can open it. Others do not see it."]}}
  ]},

 {id:"auto",icon:"ti-bolt",nav:{fr:"Automatisations",en:"Automations"},
  title:{fr:"Ce qui tourne en arrière-plan",en:"What runs in the background"},

function L(o){return o?(o[LANG]||o.fr||""):"";}

function renderBlocks(blocks){
 return blocks.map(b=>{
  if(b.t==="p") return `<div class="p">${L(b)}</div>`;
  if(b.t==="call"){const o=b[LANG]||b.fr;const ic={info:"ti-info-circle",warn:"ti-alert-triangle",good:"ti-circle-check",danger:"ti-lock"}[b.tone]||"ti-info-circle";
    return `<div class="call ${b.tone}"><i class="ti ${ic}"></i><div><b>${o.t}</b><br>${o.l.join("<br>")}</div></div>`;}
  if(b.t==="steps") return `<div class="steps">${b.items.map((s,i)=>`<div class="step ${s.k||''}"><div class="snum">${i+1}</div><div><div class="st-t">${L(s.t)}</div><div class="st-d">${L(s.d)}</div></div></div>`).join("")}</div>`;
  if(b.t==="flow"){let h='<div class="flow">';b.items.forEach((f,i)=>{if(i>0)h+='<span class="sep">›</span>';h+=`<div class="fbox ${f.k||''}"><b>${L(f.b)}</b>${L(f.d)?`<span>${L(f.d)}</span>`:''}</div>`;});return h+'</div>';}
  if(b.t==="grid") return `<div class="grid">${b.items.map(g=>`<div class="gcard"><div class="gt"><i class="ti ${g.i}"></i>${L(g.t)}</div><div class="gd">${L(g.d)}</div></div>`).join("")}</div>`;
  if(b.t==="channels") return `<div style="margin:12px 0">${CH.map(c=>`<div class="chl"><span class="em">${c.em}</span><span class="cn">${c.n}</span><span style="margin-left:auto;font-size:11.5px;color:var(--ink2)">${L(c)}</span></div>`).join("")}</div>`;
  if(b.t==="perm") return `<div class="perm">${PERM.map(p=>`<div class="permrow"><div><div class="pr">${L(p.pr)}</div><div class="pg">${p.pg}</div></div><span class="pill" style="background:${p.b};color:${p.c}">${L(p.a)}</span></div>`).join("")}</div>`;
  if(b.t==="rules"){const d=b.do[LANG]||b.do.fr;const n=b.dont[LANG]||b.dont.fr;
    return `<div class="rules"><div class="rcol do"><h4><i class="ti ti-thumb-up"></i>${LANG==='fr'?'À faire':'Do'}</h4><ul>${d.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="rcol dont"><h4><i class="ti ti-thumb-down"></i>${LANG==='fr'?'À éviter':"Don't"}</h4><ul>${n.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`;}
  return "";
 }).join("");
}

function render(){
 document.getElementById('h-title').textContent=L(T.title);
 document.getElementById('h-sub').textContent=L(T.sub);
 document.getElementById('foot').textContent=L(T.foot);
 document.title=L(T.title)+" —  Infrasgroup";
 document.documentElement.lang=LANG;
 document.getElementById('nav').innerHTML=SECTIONS.map(s=>`<span class="navchip" onclick="go('${s.id}')">${L(s.nav)}</span>`).join("");
 document.getElementById('content').innerHTML=SECTIONS.map((s,i)=>
   `<div class="card" id="sec-${s.id}"><h2><span class="knum">${i+1}</span><i class="ti ${s.icon}"></i> ${L(s.title)}</h2>${renderBlocks(s.blocks)}</div>`).join("");
 document.getElementById('btn-fr').classList.toggle('on',LANG==='fr');
 document.getElementById('btn-en').classList.toggle('on',LANG==='en');
}
function setLang(l){LANG=l;render();}
function go(id){const el=document.getElementById('sec-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
render();
</script>
